spring.application.name=sreservas
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_complejoArquitectura?createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
server.port=8081
server.error.include-message=always
server.error.include-stacktrace=never
application.jwt.secret-key=supersecretkeythatshouldbelongandcomplexsupersecretkeythatshouldbelongandcomplex
application.jwt.token-prefix=Bearer 
application.jwt.token-expiration-after-days=7
application.jwt.refresh-token-expiration-after-days=30